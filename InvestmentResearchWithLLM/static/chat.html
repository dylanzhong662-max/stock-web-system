<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业投研助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --blue-brand: #1456F0;
    --blue-act:   #3370FF;
    --blue-light: #EEF3FF;
    --bg:         #F5F6F8;
    --card:       #FFFFFF;
    --border:     #E0E3EA;
    --text:       #1D2129;
    --text-2:     #4E5969;
    --text-3:     #8D93A5;
    --success:    #00B42A;
    --sidebar-w:  220px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 顶栏 ── */
  .topbar {
    height: 52px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 10px;
    flex-shrink: 0;
    z-index: 10;
  }
  .topbar-logo {
    width: 28px; height: 28px;
    background: var(--blue-brand);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 14px;
  }
  .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
  /* 模型选择器 */
  .model-selector {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .model-label {
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
  }
  .model-select {
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    outline: none;
    max-width: 180px;
    transition: border-color 0.2s;
  }
  .model-select:hover, .model-select:focus { border-color: var(--blue-act); }

  .topbar-status {
    font-size: 12px;
    color: var(--text-3);
    display: flex; align-items: center; gap: 5px;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--success);
  }

  /* ── 主体 ── */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── 侧栏 ── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    padding: 16px 12px;
    gap: 6px;
    overflow-y: auto;
  }
  .sidebar-section {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 8px 8px 4px;
    text-transform: uppercase;
  }
  .sidebar-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-2);
    text-align: left;
    width: 100%;
    transition: background 0.15s;
  }
  .sidebar-btn:hover { background: var(--blue-light); color: var(--blue-brand); }
  .sidebar-btn.active { background: var(--blue-light); color: var(--blue-brand); font-weight: 500; }
  .sidebar-btn .icon { font-size: 15px; width: 20px; text-align: center; }
  .sidebar-divider {
    height: 1px; background: var(--border); margin: 6px 0;
  }

  /* ── 对话区 ── */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .message {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 12px;
  }
  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .avatar.ai { background: var(--blue-brand); color: #fff; }
  .avatar.user { background: var(--blue-light); color: var(--blue-brand); }

  .bubble {
    max-width: calc(100% - 44px);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
  }
  .message.ai .bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .message.user .bubble {
    background: var(--blue-act);
    color: #fff;
    border-top-right-radius: 4px;
  }

  /* Markdown 内容样式 */
  .bubble h1, .bubble h2 { font-size: 16px; font-weight: 600; margin: 14px 0 6px; color: var(--text); }
  .bubble h3 { font-size: 14px; font-weight: 600; margin: 12px 0 4px; color: var(--text); }
  .bubble h2:first-child, .bubble h1:first-child { margin-top: 0; }
  .bubble p { margin: 6px 0; }
  .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
  .bubble li { margin: 3px 0; }
  .bubble strong { font-weight: 600; color: var(--text); }
  .bubble code {
    background: var(--bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
    font-family: "SF Mono", Consolas, monospace;
    color: var(--blue-brand);
  }
  .bubble pre {
    background: #1e2433;
    color: #e8eaf0;
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12px;
    line-height: 1.6;
  }
  .bubble pre code { background: none; color: inherit; padding: 0; }
  .bubble blockquote {
    border-left: 3px solid var(--blue-act);
    padding-left: 12px;
    margin: 8px 0;
    color: var(--text-2);
    font-size: 13px;
  }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  /* 表格 */
  .table-wrap {
    overflow-x: auto;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .bubble table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .bubble th {
    background: var(--blue-light);
    color: var(--blue-brand);
    font-weight: 600;
    padding: 8px 12px;
    text-align: left;
    white-space: nowrap;
  }
  .bubble td {
    padding: 7px 12px;
    border-top: 1px solid var(--border);
    color: var(--text-2);
    vertical-align: top;
  }
  .bubble tr:hover td { background: #fafbfc; }

  /* 加载动画 */
  .typing { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-3);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* ── 输入区 ── */
  .input-area {
    padding: 16px 24px 20px;
    background: var(--card);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-box {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }
  .input-box:focus-within { border-color: var(--blue-act); }
  .input-box textarea {
    flex: 1;
    border: none;
    background: none;
    resize: none;
    outline: none;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    font-family: inherit;
    max-height: 140px;
    min-height: 24px;
  }
  .input-box textarea::placeholder { color: var(--text-3); }
  .send-btn {
    width: 34px; height: 34px;
    background: var(--blue-act);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    flex-shrink: 0;
    transition: background 0.15s, opacity 0.15s;
  }
  .send-btn:hover { background: var(--blue-brand); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }

  /* 欢迎页 */
  .welcome {
    max-width: 600px;
    margin: 40px auto;
    padding: 0 24px;
    text-align: center;
  }
  .welcome-logo {
    width: 56px; height: 56px;
    background: var(--blue-brand);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 26px;
    margin: 0 auto 16px;
  }
  .welcome h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .welcome p { font-size: 14px; color: var(--text-2); line-height: 1.6; margin-bottom: 28px; }
  .welcome-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    text-align: left;
  }
  .welcome-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .welcome-card:hover {
    border-color: var(--blue-act);
    box-shadow: 0 2px 8px rgba(51,112,255,0.1);
  }
  .welcome-card .card-icon { font-size: 20px; margin-bottom: 6px; }
  .welcome-card .card-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .welcome-card .card-desc { font-size: 12px; color: var(--text-3); line-height: 1.5; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* ── 预测跟踪 Modal ── */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(29,33,41,0.45);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: var(--card);
    width: min(900px, 92vw);
    max-height: 88vh;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close {
    margin-left: auto;
    width: 28px; height: 28px;
    border: none; background: none;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-3); font-size: 18px;
  }
  .modal-close:hover { background: var(--bg); color: var(--text); }
  .modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--bg);
    border-radius: 8px;
    padding: 12px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-top: 4px;
  }
  .stat-value.good { color: var(--success); }
  .stat-value.bad  { color: #f53f3f; }
  .stat-value.muted { color: var(--text-3); font-size: 15px; }

  .modal-toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .mini-btn {
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    cursor: pointer;
    color: var(--text-2);
  }
  .mini-btn:hover { border-color: var(--blue-act); color: var(--blue-brand); }
  .mini-btn.primary { background: var(--blue-act); color: #fff; border-color: var(--blue-act); }
  .mini-btn.primary:hover { background: var(--blue-brand); }
  .mini-btn.active { background: var(--blue-light); color: var(--blue-brand); border-color: var(--blue-light); }
  .mini-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .pred-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .pred-table th {
    background: var(--bg);
    color: var(--text-2);
    font-weight: 600;
    padding: 8px 10px;
    text-align: left;
    white-space: nowrap;
    position: sticky; top: 0;
  }
  .pred-table td {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    color: var(--text-2);
    vertical-align: top;
  }
  .pred-table tr:hover td { background: #fafbfc; }
  .tag {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.5;
  }
  .tag.bullish { background: #e6fff0; color: var(--success); }
  .tag.bearish { background: #ffece8; color: #f53f3f; }
  .tag.neutral { background: var(--blue-light); color: var(--blue-brand); }
  .tag.hit    { background: #e6fff0; color: var(--success); }
  .tag.miss   { background: #ffece8; color: #f53f3f; }
  .tag.pending{ background: #f5f5f5; color: var(--text-3); }
  .num-pos { color: var(--success); }
  .num-neg { color: #f53f3f; }
  .empty   { text-align: center; color: var(--text-3); padding: 40px 0; font-size: 13px; }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .welcome-cards { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="topbar-logo">研</div>
  <span class="topbar-title">行业投研助手</span>
  <div class="model-selector">
    <span class="model-label">模型</span>
    <select class="model-select" id="modelSelect" onchange="onModelChange()">
      <option value="">加载中…</option>
    </select>
  </div>
  <div class="topbar-status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">就绪</span>
  </div>
</div>

<!-- 主体 -->
<div class="main">

  <!-- 侧栏 -->
  <div class="sidebar">
    <div class="sidebar-section">产业链分析</div>
    <button class="sidebar-btn" onclick="quickSend('分析AI算力产业链')">
      <span class="icon">⚡</span>AI 算力
    </button>
    <button class="sidebar-btn" onclick="quickSend('分析半导体产业链')">
      <span class="icon">💎</span>半导体
    </button>
    <button class="sidebar-btn" onclick="quickSend('分析云计算产业链')">
      <span class="icon">☁️</span>云计算
    </button>
    <button class="sidebar-btn" onclick="quickSend('分析新能源汽车产业链')">
      <span class="icon">🚗</span>新能源汽车
    </button>
    <button class="sidebar-btn" onclick="quickSend('分析AI应用SaaS产业链')">
      <span class="icon">🤖</span>AI 应用
    </button>

    <div class="sidebar-divider"></div>
    <div class="sidebar-section">公司分析</div>
    <button class="sidebar-btn" onclick="quickSend('分析英伟达 NVDA')">
      <span class="icon">📊</span>英伟达 NVDA
    </button>
    <button class="sidebar-btn" onclick="quickSend('分析台积电 TSM')">
      <span class="icon">📊</span>台积电 TSM
    </button>
    <button class="sidebar-btn" onclick="quickSend('比较NVDA和AMD')">
      <span class="icon">⚖️</span>NVDA vs AMD
    </button>

    <div class="sidebar-divider"></div>
    <div class="sidebar-section">我的组合</div>
    <button class="sidebar-btn" onclick="quickSend('分析我的持仓')">
      <span class="icon">💼</span>持仓研究报告
    </button>

    <div class="sidebar-divider"></div>
    <div class="sidebar-section">预测跟踪</div>
    <button class="sidebar-btn" onclick="openPredictions()">
      <span class="icon">🎯</span>命中率 / IC
    </button>
  </div>

  <!-- 对话区 -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <!-- 欢迎页 -->
      <div class="welcome" id="welcome">
        <div class="welcome-logo">📈</div>
        <h2>行业投研助手</h2>
        <p>基于 DeepSeek R1 的产业链分析工具，帮你快速拆解行业利润池、定位核心标的</p>
        <div class="welcome-cards">
          <div class="welcome-card" onclick="quickSend('分析AI算力产业链')">
            <div class="card-icon">⚡</div>
            <div class="card-title">AI 算力产业链</div>
            <div class="card-desc">8层拆解：芯片设计→算力基础设施，利润池排名</div>
          </div>
          <div class="welcome-card" onclick="quickSend('分析英伟达 NVDA')">
            <div class="card-icon">📊</div>
            <div class="card-title">分析单只股票</div>
            <div class="card-desc">产业链定位 + 财务快照 + 投研结论</div>
          </div>
          <div class="welcome-card" onclick="quickSend('比较NVDA和AMD')">
            <div class="card-icon">⚖️</div>
            <div class="card-title">对比两家公司</div>
            <div class="card-desc">从产业链竞争地位到估值的横向比较</div>
          </div>
          <div class="welcome-card" onclick="quickSend('分析我的持仓')">
            <div class="card-icon">💼</div>
            <div class="card-title">持仓研究报告</div>
            <div class="card-desc">读取持仓数据库，生成组合产业链分析</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
      <div class="input-box">
        <textarea
          id="inputText"
          placeholder="输入行业、公司名称或股票代码…（Enter 发送，Shift+Enter 换行）"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- 预测跟踪 Modal -->
<div class="modal-mask" id="predModal" onclick="if(event.target===this)closePredictions()">
  <div class="modal">
    <div class="modal-header">
      <span style="font-size:18px">🎯</span>
      <div class="modal-title">预测跟踪</div>
      <button class="modal-close" onclick="closePredictions()">×</button>
    </div>
    <div class="modal-body">
      <div id="predSummary" class="stat-grid">
        <div class="stat-card"><div class="stat-label">样本数</div><div class="stat-value muted" id="stCount">—</div></div>
        <div class="stat-card"><div class="stat-label">方向命中率</div><div class="stat-value muted" id="stHit">—</div></div>
        <div class="stat-card"><div class="stat-label">平均超额收益</div><div class="stat-value muted" id="stExcess">—</div></div>
        <div class="stat-card"><div class="stat-label">方向 IC</div><div class="stat-value muted" id="stIC">—</div></div>
      </div>

      <div class="modal-toolbar">
        <span style="font-size:12px;color:var(--text-3)">报告类型：</span>
        <button class="mini-btn active" data-type=""          onclick="switchType(event, '')">全部</button>
        <button class="mini-btn"        data-type="chain"     onclick="switchType(event, 'chain')">产业链</button>
        <button class="mini-btn"        data-type="company"   onclick="switchType(event, 'company')">公司</button>
        <button class="mini-btn"        data-type="portfolio" onclick="switchType(event, 'portfolio')">持仓</button>
        <span style="flex:1"></span>
        <button class="mini-btn"         id="btnResolve"  onclick="resolveNow()">立即结算</button>
        <button class="mini-btn primary" id="btnReload"   onclick="loadPredictions()">刷新</button>
      </div>

      <div id="predTableWrap">
        <div class="empty">加载中…</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ── 配置 ──────────────────────────────────────
  const API_BASE = window.location.origin;

  // marked 配置：表格包裹 div
  const renderer = new marked.Renderer();
  const origTable = renderer.table.bind(renderer);
  renderer.table = (header, body) => `<div class="table-wrap">${origTable(header, body)}</div>`;
  marked.setOptions({ renderer, breaks: true, gfm: true });

  // ── 状态 ──────────────────────────────────────
  let isStreaming = false;
  let currentModel = '';  // 空字符串 = 服务端默认

  // ── 模型列表初始化 ─────────────────────────────
  async function loadModels() {
    try {
      const res = await fetch(`${API_BASE}/api/models`);
      const data = await res.json();
      const sel = document.getElementById('modelSelect');
      sel.innerHTML = '';
      data.models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.tag ? `${m.name} · ${m.tag}` : m.name;
        if (m.id === data.default) opt.selected = true;
        sel.appendChild(opt);
      });
      currentModel = sel.value;
    } catch (e) {
      const sel = document.getElementById('modelSelect');
      sel.innerHTML = '<option value="">默认模型</option>';
    }
  }

  function onModelChange() {
    currentModel = document.getElementById('modelSelect').value;
  }

  loadModels();

  // ── 输入框自适应高度 ──────────────────────────
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    document.getElementById('sendBtn').disabled = el.value.trim() === '';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!isStreaming && document.getElementById('inputText').value.trim()) {
        sendMessage();
      }
    }
  }

  // ── 快捷按钮 ──────────────────────────────────
  function quickSend(text) {
    if (isStreaming) return;
    document.getElementById('inputText').value = text;
    autoResize(document.getElementById('inputText'));
    sendMessage();
  }

  // ── 发送消息 ──────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('inputText');
    const text = input.value.trim();
    if (!text || isStreaming) return;

    // 隐藏欢迎页
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    // 显示用户消息
    appendMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    // 显示 AI 加载状态
    const aiId = appendMessage('ai', null); // typing
    setStatus('thinking', '思考中…');
    isStreaming = true;

    try {
      const resp = await fetch(`${API_BASE}/api/chat/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: 'default', model: currentModel || null }),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';

      setStatus('streaming', '生成中…');

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            if (parsed.text) {
              fullText += parsed.text;
              updateMessage(aiId, fullText);
            }
          } catch {}
        }
      }

    } catch (err) {
      updateMessage(aiId, `⚠️ 请求失败：${err.message}`);
    } finally {
      isStreaming = false;
      setStatus('ready', '就绪');
    }
  }

  // ── DOM 操作 ──────────────────────────────────
  let msgCounter = 0;

  function appendMessage(role, text) {
    const id = 'msg-' + (++msgCounter);
    const messages = document.getElementById('messages');

    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;
    wrap.id = id;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'ai' ? '研' : '我';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (text === null) {
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    } else {
      bubble.innerHTML = role === 'ai' ? marked.parse(text) : escapeHtml(text);
    }

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
    return id;
  }

  function updateMessage(id, text) {
    const wrap = document.getElementById(id);
    if (!wrap) return;
    const bubble = wrap.querySelector('.bubble');
    bubble.innerHTML = marked.parse(text);
    const messages = document.getElementById('messages');
    messages.scrollTop = messages.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setStatus(state, text) {
    document.getElementById('statusText').textContent = text;
    const dot = document.getElementById('statusDot');
    dot.style.background = state === 'ready' ? 'var(--success)'
                         : state === 'thinking' ? '#FF7D00'
                         : 'var(--blue-act)';
  }

  // 初始化：输入框监听
  document.getElementById('inputText').addEventListener('input', function() {
    document.getElementById('sendBtn').disabled = this.value.trim() === '';
  });

  // ── 预测跟踪 ──────────────────────────────────
  let predType = '';  // '' | 'chain' | 'company' | 'portfolio'

  function openPredictions() {
    document.getElementById('predModal').classList.add('open');
    loadPredictions();
  }

  function closePredictions() {
    document.getElementById('predModal').classList.remove('open');
  }

  function switchType(ev, t) {
    predType = t;
    document.querySelectorAll('.mini-btn[data-type]').forEach(b => b.classList.remove('active'));
    ev.target.classList.add('active');
    loadPredictions();
  }

  async function loadPredictions() {
    const btn = document.getElementById('btnReload');
    btn.disabled = true; btn.textContent = '加载中…';
    try {
      const qs = predType ? `?type=${predType}` : '';
      const [perfRes, listRes] = await Promise.all([
        fetch(`${API_BASE}/api/research/predictions/performance${qs}`),
        fetch(`${API_BASE}/api/research/predictions${qs ? qs + '&' : '?'}limit=100`),
      ]);
      const perf = await perfRes.json();
      const list = await listRes.json();
      renderSummary(perf);
      renderTable(list);
    } catch (e) {
      document.getElementById('predTableWrap').innerHTML =
        `<div class="empty">加载失败：${e.message}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = '刷新';
    }
  }

  function renderSummary(p) {
    const fmtPct = v => v == null ? '—' : `${(v * 100).toFixed(1)}%`;
    const fmtIC  = v => v == null ? '—' : v.toFixed(3);

    const countEl  = document.getElementById('stCount');
    const hitEl    = document.getElementById('stHit');
    const excessEl = document.getElementById('stExcess');
    const icEl     = document.getElementById('stIC');

    countEl.textContent = p.count ?? 0;
    countEl.className = 'stat-value' + (p.count ? '' : ' muted');

    hitEl.textContent = fmtPct(p.hit_rate);
    hitEl.className = 'stat-value' + (
      p.hit_rate == null ? ' muted' :
      p.hit_rate >= 0.55 ? ' good' :
      p.hit_rate < 0.45  ? ' bad'  : ''
    );

    excessEl.textContent = fmtPct(p.avg_excess);
    excessEl.className = 'stat-value' + (
      p.avg_excess == null ? ' muted' :
      p.avg_excess > 0 ? ' good' : ' bad'
    );

    icEl.textContent = fmtIC(p.direction_ic);
    icEl.className = 'stat-value' + (
      p.direction_ic == null ? ' muted' :
      p.direction_ic >= 0.05 ? ' good' :
      p.direction_ic < 0     ? ' bad'  : ''
    );
  }

  function renderTable(rows) {
    const wrap = document.getElementById('predTableWrap');
    if (!rows || rows.length === 0) {
      wrap.innerHTML = '<div class="empty">暂无预测记录。先跑一次产业链或持仓分析，LLM 会自动落库预测。</div>';
      return;
    }

    const fmtDate = s => s ? s.slice(0, 10) : '—';
    const fmtPct  = v => v == null ? '—' : `${(v * 100).toFixed(1)}%`;
    const numCls  = v => v == null ? '' : (v >= 0 ? 'num-pos' : 'num-neg');

    const head = `
      <tr>
        <th>创建</th><th>类型</th><th>标的/行业</th><th>方向</th>
        <th>置信</th><th>H天</th><th>入场价</th>
        <th>实际收益</th><th>超额</th><th>结果</th><th>理由</th>
      </tr>`;

    const body = rows.map(r => {
      const dir = (r.direction || '').toLowerCase();
      const resolvedTag =
        r.resolved_at == null ? '<span class="tag pending">待结算</span>' :
        r.hit             ? '<span class="tag hit">✓ 命中</span>' :
                            '<span class="tag miss">✗ 未中</span>';

      const conf = r.confidence != null ? `${(r.confidence * 100).toFixed(0)}%` : '—';

      return `
        <tr>
          <td>${fmtDate(r.created_at)}</td>
          <td>${r.report_type}</td>
          <td><strong>${r.ticker || r.cache_key || '—'}</strong></td>
          <td><span class="tag ${dir}">${dir}</span></td>
          <td>${conf}</td>
          <td>${r.horizon_days}</td>
          <td>${r.entry_price != null ? r.entry_price.toFixed(2) : '—'}</td>
          <td class="${numCls(r.realized_return)}">${fmtPct(r.realized_return)}</td>
          <td class="${numCls(r.excess_return)}">${fmtPct(r.excess_return)}</td>
          <td>${resolvedTag}</td>
          <td style="max-width:200px;font-size:12px;color:var(--text-3)">${
            escapeHtml(r.rationale || '')
          }</td>
        </tr>`;
    }).join('');

    wrap.innerHTML = `<div class="table-wrap"><table class="pred-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  async function resolveNow() {
    const btn = document.getElementById('btnResolve');
    btn.disabled = true; btn.textContent = '结算中…';
    try {
      const res = await fetch(`${API_BASE}/api/research/predictions/resolve`, { method: 'POST' });
      const data = await res.json();
      alert(`结算完成：已结算 ${data.resolved} 条`);
      loadPredictions();
    } catch (e) {
      alert('结算失败：' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = '立即结算';
    }
  }

  // ESC 关闭 Modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePredictions();
  });
</script>
</body>
</html>
