<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>止盈止损对比 - 技术面 vs 基本面</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --blue-brand: #1456F0;
  --blue-act:   #3370FF;
  --blue-light: #EEF3FF;
  --blue-mid:   #C2D1FF;
  --bg:         #F5F6F8;
  --card:       #FFFFFF;
  --border:     #E0E3EA;
  --border-2:   #F0F1F4;
  --text:       #1D2129;
  --text-2:     #4E5969;
  --text-3:     #8D93A5;
  --green:      #00B42A;
  --green-bg:   #E8F7EB;
  --red:        #F53F3F;
  --red-bg:     #FFECE8;
  --orange:     #FF7D00;
  --orange-bg:  #FFF3E8;
  --purple:     #7B61FF;
  --purple-bg:  #F3F0FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  padding: 24px;
  max-width: 1400px;
  margin: 0 auto;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.header h1 { font-size: 20px; font-weight: 700; }
.header-sub { font-size: 13px; color: var(--text-3); margin-top: 4px; }

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 16px;
  border-radius: 6px;
  border: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity .15s;
}
.btn:hover { opacity: .88; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--blue-act); color: #fff; }
.btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
.btn-back { background: none; border: none; color: var(--text-2); font-size: 13px; cursor: pointer; text-decoration: none; }
.btn-back:hover { color: var(--text); }

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-3);
  font-size: 14px;
}
.spinner {
  display: inline-block; width: 18px; height: 18px;
  border: 2px solid rgba(51,112,255,.25);
  border-top-color: var(--blue-act);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.legend {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  padding: 12px 16px;
  background: var(--card);
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 13px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 3px;
}
.dot-tech { background: var(--blue-act); }
.dot-fund { background: var(--purple); }
.dot-diff { background: var(--orange); }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-2);
}
.card-ticker {
  font-size: 16px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.card-meta {
  display: flex; gap: 12px; font-size: 12px; color: var(--text-3);
}
.card-meta span { display: flex; align-items: center; gap: 4px; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-purple { background: var(--purple-bg); color: var(--purple); }
.badge-gray { background: #F2F3F5; color: var(--text-3); }

.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}
.compare-col {
  padding: 16px 20px;
}
.compare-col:first-child {
  border-right: 1px solid var(--border-2);
}
.compare-col-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.compare-col-title .legend-dot { width: 8px; height: 8px; }

.stop-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-2);
}
.stop-row:last-child { border-bottom: none; }
.stop-label { font-size: 13px; color: var(--text-2); }
.stop-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 600;
}
.stop-value.red { color: var(--red); }
.stop-value.green { color: var(--green); }

.diff-section {
  padding: 12px 20px;
  background: #FAFBFC;
  border-top: 1px solid var(--border-2);
}
.diff-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--orange);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 8px;
}
.diff-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 13px;
}
.diff-label { color: var(--text-3); }
.diff-value {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
}
.diff-positive { color: var(--green); }
.diff-negative { color: var(--red); }

.factors-section {
  padding: 12px 20px;
  border-top: 1px solid var(--border-2);
}
.factors-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--purple);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 8px;
}
.factor-tag {
  display: inline-block;
  padding: 4px 10px;
  background: var(--purple-bg);
  color: var(--purple);
  border-radius: 4px;
  font-size: 12px;
  margin: 2px 4px 2px 0;
}
.no-fundamental {
  padding: 12px 16px;
  background: #FAFBFC;
  border-top: 1px solid var(--border-2);
  font-size: 12px;
  color: var(--text-3);
  text-align: center;
}

.price-bar {
  position: relative;
  height: 32px;
  background: var(--bg);
  border-radius: 6px;
  margin: 12px 20px 16px;
  overflow: visible;
}
.price-marker {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  padding: 2px 4px;
  border-radius: 3px;
  white-space: nowrap;
}
.marker-stop-tech { background: rgba(51,112,255,.15); color: var(--blue-act); top: 20%; }
.marker-stop-fund { background: rgba(123,97,255,.15); color: var(--purple); top: 80%; }
.marker-price { background: var(--text); color: #fff; top: 50%; z-index: 2; }
.marker-t1-tech { background: rgba(51,112,255,.15); color: var(--blue-act); top: 20%; }
.marker-t1-fund { background: rgba(123,97,255,.15); color: var(--purple); top: 80%; }

.fundamental-kpi {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 0 20px 16px;
}
.fkpi {
  text-align: center;
  padding: 8px;
  background: var(--bg);
  border-radius: 6px;
}
.fkpi-label { font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.fkpi-value { font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-3);
}

@media (max-width: 768px) {
  body { padding: 12px; }
  .compare-grid { grid-template-columns: 1fr; }
  .compare-col:first-child { border-right: none; border-bottom: 1px solid var(--border-2); }
  .fundamental-kpi { grid-template-columns: repeat(2, 1fr); }
  .legend { flex-wrap: wrap; gap: 10px; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <a href="/" class="btn-back">&larr; 返回主页</a>
    <h1>止盈止损对比</h1>
    <div class="header-sub">技术面 (Plan A) vs 技术面+基本面 (Plan A+B)</div>
  </div>
  <button class="btn btn-primary" id="refresh-btn" onclick="loadData()">
    <span id="refresh-text">加载对比数据</span>
  </button>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot dot-tech"></div> 技术面 (ATR+Regime)</div>
  <div class="legend-item"><div class="legend-dot dot-fund"></div> 技术面+基本面 (ATR+估值+EPS+财报)</div>
  <div class="legend-item"><div class="legend-dot dot-diff"></div> 差异 (基本面调整幅度)</div>
</div>

<div id="content">
  <div class="empty">点击「加载对比数据」查看各持仓的新旧止盈止损对比</div>
</div>

<script>
async function loadData() {
  const btn = document.getElementById('refresh-btn');
  const text = document.getElementById('refresh-text');
  btn.disabled = true;
  text.innerHTML = '<span class="spinner"></span>加载中...';

  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading"><span class="spinner"></span>正在获取行情数据和基本面数据，请稍候...</div>';

  try {
    const data = await fetch('/api/stops/compare').then(r => r.json());
    if (!data.length) {
      content.innerHTML = '<div class="empty">暂无持仓数据，请先添加持仓</div>';
      return;
    }
    content.innerHTML = data.map(renderCard).join('');
  } catch(e) {
    content.innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    text.textContent = '刷新数据';
  }
}

function renderCard(item) {
  const tech = item.tech_only;
  const fund = item.tech_fundamental;
  const hasFund = item.has_fundamental && fund;

  if (!tech) {
    return `<div class="card">
      <div class="card-header">
        <span class="card-ticker">${item.ticker}</span>
        <span class="badge badge-gray">数据不足</span>
      </div>
      <div class="no-fundamental">无法计算止盈止损（行情数据不足）</div>
    </div>`;
  }

  const dirBadge = item.direction === 'long'
    ? '<span class="badge badge-green">多</span>'
    : '<span class="badge badge-red">空</span>';

  // 计算差异
  const stopDiff = hasFund ? fund.stop_loss - tech.stop_loss : 0;
  const t1Diff = hasFund ? fund.profit_target - tech.profit_target : 0;
  const t2Diff = hasFund ? fund.profit_target_2 - tech.profit_target_2 : 0;

  const formatDiff = (v) => {
    if (Math.abs(v) < 0.01) return '<span class="diff-value">-</span>';
    const sign = v > 0 ? '+' : '';
    const cls = item.direction === 'long'
      ? (v > 0 ? 'diff-positive' : 'diff-negative')
      : (v < 0 ? 'diff-positive' : 'diff-negative');
    return `<span class="diff-value ${cls}">${sign}$${v.toFixed(2)}</span>`;
  };

  // 价格条可视化
  const priceBar = renderPriceBar(item, tech, fund);

  // 基本面 KPI
  let fkpiHtml = '';
  if (item.has_fundamental) {
    const pe = item.pe_ratio != null ? item.pe_ratio.toFixed(1) : '-';
    const pePctl = item.pe_percentile != null ? `${(item.pe_percentile * 100).toFixed(0)}%` : '-';
    const eps = item.eps_declining === true ? '<span style="color:var(--red)">下降</span>'
              : item.eps_declining === false ? '<span style="color:var(--green)">健康</span>' : '-';
    const earn = item.days_to_earnings != null ? `${item.days_to_earnings}天` : '-';
    const target = item.analyst_target != null ? `$${item.analyst_target.toFixed(1)}` : '-';

    fkpiHtml = `<div class="fundamental-kpi">
      <div class="fkpi"><div class="fkpi-label">P/E</div><div class="fkpi-value">${pe}</div></div>
      <div class="fkpi"><div class="fkpi-label">P/E分位</div><div class="fkpi-value">${pePctl}</div></div>
      <div class="fkpi"><div class="fkpi-label">EPS趋势</div><div class="fkpi-value">${eps}</div></div>
      <div class="fkpi"><div class="fkpi-label">距财报</div><div class="fkpi-value">${earn}</div></div>
    </div>`;
  }

  // 因子标签
  let factorsHtml = '';
  if (item.fundamental_factors && item.fundamental_factors.length) {
    factorsHtml = `<div class="factors-section">
      <div class="factors-title">触发因子</div>
      ${item.fundamental_factors.map(f => `<span class="factor-tag">${f}</span>`).join('')}
    </div>`;
  }

  // 差异区域
  let diffHtml = '';
  if (hasFund && (Math.abs(stopDiff) > 0.01 || Math.abs(t1Diff) > 0.01 || Math.abs(t2Diff) > 0.01)) {
    diffHtml = `<div class="diff-section">
      <div class="diff-title">基本面调整差异</div>
      <div class="diff-row"><span class="diff-label">止损调整</span>${formatDiff(stopDiff)}</div>
      <div class="diff-row"><span class="diff-label">T1调整</span>${formatDiff(t1Diff)}</div>
      <div class="diff-row"><span class="diff-label">T2调整</span>${formatDiff(t2Diff)}</div>
    </div>`;
  } else if (!hasFund) {
    diffHtml = `<div class="no-fundamental">非美股个股，无基本面数据，两种算法结果一致</div>`;
  } else {
    diffHtml = `<div class="no-fundamental">基本面因子未触发，两种算法结果一致</div>`;
  }

  return `<div class="card">
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="card-ticker">${item.ticker}</span>
        ${dirBadge}
        ${hasFund ? '<span class="badge badge-purple">基本面生效</span>' : ''}
      </div>
      <div class="card-meta">
        <span>成本 $${item.entry_price}</span>
        <span>现价 $${item.current_price}</span>
        <span>ATR $${item.atr}</span>
      </div>
    </div>
    ${fkpiHtml}
    ${priceBar}
    <div class="compare-grid">
      <div class="compare-col">
        <div class="compare-col-title"><div class="legend-dot dot-tech"></div>技术面</div>
        <div class="stop-row"><span class="stop-label">止损</span><span class="stop-value red">$${tech.stop_loss}</span></div>
        <div class="stop-row"><span class="stop-label">止盈 T1</span><span class="stop-value green">$${tech.profit_target}</span></div>
        <div class="stop-row"><span class="stop-label">止盈 T2</span><span class="stop-value green">$${tech.profit_target_2}</span></div>
      </div>
      <div class="compare-col">
        <div class="compare-col-title"><div class="legend-dot dot-fund"></div>技术+基本面</div>
        <div class="stop-row"><span class="stop-label">止损</span><span class="stop-value red">$${hasFund ? fund.stop_loss : tech.stop_loss}</span></div>
        <div class="stop-row"><span class="stop-label">止盈 T1</span><span class="stop-value green">$${hasFund ? fund.profit_target : tech.profit_target}</span></div>
        <div class="stop-row"><span class="stop-label">止盈 T2</span><span class="stop-value green">$${hasFund ? fund.profit_target_2 : tech.profit_target_2}</span></div>
      </div>
    </div>
    ${diffHtml}
    ${factorsHtml}
  </div>`;
}

function renderPriceBar(item, tech, fund) {
  if (!tech) return '';
  const hasFund = item.has_fundamental && fund;

  const prices = [tech.stop_loss, tech.profit_target, tech.profit_target_2, item.current_price];
  if (hasFund) prices.push(fund.stop_loss, fund.profit_target, fund.profit_target_2);
  const min = Math.min(...prices) * 0.995;
  const max = Math.max(...prices) * 1.005;
  const range = max - min;
  if (range <= 0) return '';

  const pct = (v) => ((v - min) / range * 100).toFixed(1);

  let markers = '';
  markers += `<div class="price-marker marker-price" style="left:${pct(item.current_price)}%">$${item.current_price}</div>`;
  markers += `<div class="price-marker marker-stop-tech" style="left:${pct(tech.stop_loss)}%">S:$${tech.stop_loss}</div>`;
  markers += `<div class="price-marker marker-t1-tech" style="left:${pct(tech.profit_target)}%">T1:$${tech.profit_target}</div>`;

  if (hasFund && Math.abs(fund.stop_loss - tech.stop_loss) > 0.01) {
    markers += `<div class="price-marker marker-stop-fund" style="left:${pct(fund.stop_loss)}%">S:$${fund.stop_loss}</div>`;
  }
  if (hasFund && Math.abs(fund.profit_target - tech.profit_target) > 0.01) {
    markers += `<div class="price-marker marker-t1-fund" style="left:${pct(fund.profit_target)}%">T1:$${fund.profit_target}</div>`;
  }

  return `<div class="price-bar">${markers}</div>`;
}
</script>
</body>
</html>
